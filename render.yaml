services:
  - type: web
    name: url2src
    runtime: docker
    plan: standard        # Chromium needs RAM. 512MB plans: set WORKERS=1
    healthCheckPath: /health
    envVars:
      - key: WORKERS
        value: "2"
      # Optional: ADMIN_KEY (default asraful123), DATABASE_URL (persistent keys), KEYS_FILE (e.g. /data/keys.json on a Render Disk)
