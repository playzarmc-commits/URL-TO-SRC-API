services:
  - type: web
    name: url2src
    runtime: docker
    plan: standard        # Chromium needs RAM. 512MB plans: set WORKERS=1
    healthCheckPath: /health
    envVars:
      - key: API_KEYS
        generateValue: true   # or set "botA:key1,botB:key2" in the dashboard
      - key: WORKERS
        value: "2"
      - key: RATE_PER_MIN
        value: "60"
